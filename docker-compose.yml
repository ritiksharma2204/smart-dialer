services:
  postgres:
    image: postgres:16
    container_name: smart-dialer-postgres
    environment:
      POSTGRES_USER: dialer
      POSTGRES_PASSWORD: dialer
      POSTGRES_DB: smart_dialer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dialer -d smart_dialer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: